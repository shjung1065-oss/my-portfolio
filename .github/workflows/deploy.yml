name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # Supabase 공개(publishable) 키: 브라우저 노출용 키이며 데이터는 RLS·컬럼 권한으로 보호됨
        env:
          VITE_SUPABASE_URL: https://zjjjofxdjgsnhxsdcgwg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_4nf22PPjXWCcBwmXb-M-Sg_GBw_Z6_K
        run: |
          npm run build
          cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
