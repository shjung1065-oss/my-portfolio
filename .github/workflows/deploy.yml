name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 빌드와 배포를 별도 job 으로 분리 (GitHub 공식 권장 구조)
# → 업로드한 결과물이 등록된 뒤에 배포 job 이 시작되어 "artifact 없음" 오류를 줄임
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # Supabase 공개(publishable) 키: 브라우저 노출용 키이며 데이터는 RLS·컬럼 권한으로 보호됨
        env:
          VITE_SUPABASE_URL: https://zjjjofxdjgsnhxsdcgwg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_4nf22PPjXWCcBwmXb-M-Sg_GBw_Z6_K
        run: |
          npm run build
          cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
